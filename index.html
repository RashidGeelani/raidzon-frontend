    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="preload" as="image" href="/brand/raidzon-logo-256.webp" />
    <script>
      // Chrome can offer installation before the app's code has loaded; keep the offer for it.
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__raidzonInstallEvent = event;
      });
    </script>
    <script type="application/ld+json">

  <body>
    <div id="root"></div>
    <noscript>
      <h1>RaidzOn: kabaddi live score, tournaments and scoring app</h1>
      <p>
        RaidzOn lets kabaddi organizers and scorers score matches raid by raid from a phone, even
        offline at the court. Run tournaments with fixtures, groups and points tables, track player
        raid points, tackle points and leaderboards, and share a live score link so fans can follow
        every raid in real time. Free to use; install it as an app from your browser.
      </p>
      <p>
        Every tournament has a public page at /tournaments/ with its points table, fixtures,
        results and top players, and every player has a page at /players/ with career raid and
        tackle stats. All public pages are listed in the <a href="/sitemap.xml">sitemap</a>.
      </p>
      <p>
        <a href="/">Home</a> · <a href="/guide/kabaddi-rules">Kabaddi rules</a> ·
        <a href="/guide/how-to-score-kabaddi">How to score kabaddi</a> ·
        <a href="/guide/run-a-kabaddi-tournament">Run a tournament</a> · <a href="/help">Help &amp; FAQ</a> ·
        <a href="/privacy">Privacy</a>
      </p>
      <p>Enable JavaScript to use RaidzOn.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
