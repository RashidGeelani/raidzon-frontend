server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Deployment ingress should route /api/ to the separately hosted backend.
    # Never serve the SPA HTML for an API request when that route is absent.
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"message":"Account services are not configured on this host."}';
    }

    # Hashed bundles can be cached; entry points and workers must stay fresh.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
